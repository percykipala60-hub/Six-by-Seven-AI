<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Six by Seven.AI</title>
    <meta name="description" content="Colle une discussion. Six comprend la situation, repère les arnaques et te propose trois réponses dans ton ton. Tu choisis, tu ajustes, tu envoies." />
    <meta name="theme-color" content="#F4ECDE" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Pas de manifeste d'application (site.webmanifest) : ce site présente Six, il ne s'installe pas.
         L'application se télécharge depuis la page Télécharger. -->

    <link rel="canonical" href="__SITE_URL__/" />

    <!-- Google Analytics, mesure COUPÉE tant que le visiteur n'a pas accepté (ga-disable + consentement refusé) :
         aucun cookie, aucune mesure. Le code est dans la page pour que Google Search Console puisse vérifier le
         site avec Google Analytics. Après accord, src/analytics/analytics.ts active la mesure.
         __GA_ID__ est remplacé au build par l'identifiant de src/content/site.ts (voir vite.config.ts). -->
    <script>
      window["ga-disable-__GA_ID__"] = true;
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("consent", "default", { analytics_storage: "denied", ad_storage: "denied", ad_user_data: "denied", ad_personalization: "denied" });
      gtag("js", new Date());
      gtag("config", "__GA_ID__", { send_page_view: false, allow_google_signals: false, allow_ad_personalization_signals: false });
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=__GA_ID__"></script>

    <!-- Google Search Console : prouve que le site appartient à Seven.AI (à garder tant que le site y est suivi). -->
    <meta name="google-site-verification" content="YXAJShDQLZISLhhT9IGDZfVhxxaLMXsNCCg44KeFrvc" />

    <!-- Aperçu quand le lien est partagé (WhatsApp, Facebook, LinkedIn...).
         Les adresses doivent être complètes : elles sont complétées avec l'adresse du site au moment
         du build (voir vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Six by Seven.AI" />
    <meta property="og:title" content="Six by Seven.AI" />
    <meta property="og:description" content="Trois réponses dans ton ton, des arnaques repérées, tes informations masquées. Par Seven.AI." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Polices hébergées sur le site (voir src/styles/fonts.css) : celles de l'alphabet latin, utilisées
         dès le premier écran, sont demandées tout de suite, en même temps que la page. -->
    <link rel="preload" href="/fonts/googlesans-v71-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-v20-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
