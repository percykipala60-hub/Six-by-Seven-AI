<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Six by Seven.AI</title>
    <meta name="description" content="Colle une discussion. Six comprend la situation, repère les arnaques et te propose trois réponses dans ton ton. Tu choisis, tu ajustes, tu envoies." />
    <meta name="theme-color" content="#F4ECDE" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="canonical" href="https://six-by-sevenai.onrender.com/" />

    <!-- Aperçu quand le lien est partagé (WhatsApp, Facebook, LinkedIn...).
         Les adresses doivent être complètes : à changer si le site passe sur un nom de domaine. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Six by Seven.AI" />
    <meta property="og:title" content="Six by Seven.AI" />
    <meta property="og:description" content="Trois réponses dans ton ton, des arnaques repérées, tes informations masquées. Par Seven.AI." />
    <meta property="og:url" content="https://six-by-sevenai.onrender.com/" />
    <meta property="og:image" content="https://six-by-sevenai.onrender.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Polices hébergées sur le site (voir src/styles/fonts.css) : celles de l'alphabet latin, utilisées
         dès le premier écran, sont demandées tout de suite, en même temps que la page. -->
    <link rel="preload" href="/fonts/googlesans-v71-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-v20-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
