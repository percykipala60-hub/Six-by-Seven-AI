# Tout Six en local, identique à la production : docker compose up --build
# Puis ouvre http://localhost:3000
services:
  redis:
    image: redis:7.4.6-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no'] # mémoire seule : rien n'est gardé
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      NODE_ENV: production
      CORS_ORIGINS: http://localhost:3000
      RATE_LIMIT_PER_MINUTE: '30'
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
    ports: ['4000:4000']
    depends_on:
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000 # adresse vue par le navigateur
    ports: ['3000:3000']
    depends_on: [api]
