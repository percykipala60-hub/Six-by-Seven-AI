# Production de Six sur notre serveur, derrière sixbysevenai.com.
# - site  : construit le site de présentation (dossier site/), puis s'arrête ; Caddy en sert le résultat.
# - six   : l'application Six (dossier app/, Next.js).
# - caddy : HTTPS automatique ; sixbysevenai.com → site, app.sixbysevenai.com → application.
# Sur le serveur, depuis ce dossier :  docker compose up -d --build
# Les réglages secrets sont dans deploy/.env (jamais dans Git) : voir .env.example.
services:
  site:
    image: node:22.22-alpine
    working_dir: /site
    volumes:
      - ../site:/site
    environment:
      SITE_URL: https://${DOMAINE}
    command: sh -c "npm ci --no-audit --no-fund && npm run build"
    restart: 'no'

  six:
    build:
      context: ../app
      dockerfile: apps/web/Dockerfile
      # Les valeurs NEXT_PUBLIC_* sont figées dans l'app au moment de la construction.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Un seul relais de confiance devant l'app : Caddy. La limite de débit lit alors la vraie adresse.
      TRUST_PROXY: '1'
    expose: ['3000']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    env_file: .env
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../site/dist:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      six:
        condition: service_started
      site:
        condition: service_completed_successfully

volumes:
  caddy_data:
  caddy_config:
