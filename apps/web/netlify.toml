# Netlify — app Six (apps/web : design Six 3 + Kin Rush).
# Sur Netlify : « Import an existing project » → ce dépôt → Netlify lit ce fichier.
# Il reste à définir dans l'interface (Site configuration → Environment variables), voir .env.example :
#   ANTHROPIC_API_KEY (et/ou OPENAI_API_KEY), AI_PROVIDERS, AI_DAILY_LIMIT, TRUST_PROXY=1, ALLOWED_ORIGINS,
#   UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN, RATE_LIMIT_HASH_SECRET
# Ces clés restent côté serveur (routes /api de Next.js) : elles n'arrivent jamais dans le navigateur.
# Sans clé, Six tourne en « Mode démonstration ».

[build]
  base = "apps/web"
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Netlify exécute pnpm tout seul (Corepack) ; on fige la version du repo.
  NPM_FLAGS = "--version"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  # Route aussi /api vers les handlers Next.js côté serveur : aucun proxy externe n'est requis pour Netlify.
  package = "@netlify/plugin-nextjs"

# Les polices du jeu peuvent être mises en cache un mois.
[[headers]]
  for = "/jeu/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"
