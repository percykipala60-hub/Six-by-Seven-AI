# Netlify — PWA Six (apps/web uniquement).
# Sur Netlify : « Import an existing project » → ce dépôt → Netlify lit ce fichier.
# Il reste à définir dans l'interface (Site configuration → Environment variables) :
#   NEXT_PUBLIC_API_URL = https://<ton-api>.up.railway.app   (l'adresse publique de l'API)
# C'est une variable de BUILD : si l'URL de l'API change, il faut relancer un déploiement.

[build]
  base = "apps/web"
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Netlify exécute pnpm tout seul (Corepack) ; on fige la version du repo.
  NPM_FLAGS = "--version"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  # Officiel : détecte Next.js, gère les routes serveur et les redirections.
  package = "@netlify/plugin-nextjs"

# Le service worker doit toujours être frais (pas de cache agressif).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Les icônes PWA peuvent être mises en cache un mois.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"
